spring.application.name=eventos
server.port=8081
spring.datasource.url=${EVENTOS_DB_URL:jdbc:h2:file:./dados/eventos;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${EVENTOS_DB_USER:sa}
spring.datasource.password=${EVENTOS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${EVENTOS_H2_CONSOLE_ENABLED:false}
spring.h2.console.settings.web-allow-others=false
# Desligado por padrão na execução isolada; habilitado no teste distribuído e futuro Compose.
eureka.client.enabled=${DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# Limites curtos para demonstração; não repetir mutações automaticamente.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
resilience4j.circuitbreaker.instances.espacos.sliding-window-size=5
resilience4j.circuitbreaker.instances.espacos.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.espacos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.espacos.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.espacos.permitted-number-of-calls-in-half-open-state=2
spring.profiles.default=local
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level app=${spring.application.name} correlationId=%X{correlationId:-none} %logger{36} - %msg%n
logging.pattern.file=${logging.pattern.console}
