# Cada contexto de teste recebe um banco descartável, separado do banco local.
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.application.name=eventos
spring.jpa.open-in-view=false
eureka.client.enabled=false

# Mesma decisão da aplicação: o limite é controlado pelo cliente HTTP.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
