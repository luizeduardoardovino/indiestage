spring.application.name=eureka-server
server.port=${SERVER_PORT:8761}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.profiles.default=local
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level app=${spring.application.name} correlationId=%X{correlationId:-none} %logger{36} - %msg%n
logging.pattern.file=${logging.pattern.console}
