# Ambiente de containers. O catálogo é configurado pela rede interna do Compose.
server.port=${SERVER_PORT:8080}
logging.file.name=/logs/${spring.application.name}.log
spring.datasource.url=jdbc:h2:file:/data/espacos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${ESPACOS_DB_USER:sa}
spring.datasource.password=${ESPACOS_DB_PASSWORD}
spring.h2.console.enabled=false
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true
