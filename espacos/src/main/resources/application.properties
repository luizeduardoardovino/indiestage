spring.application.name=espacos
# Caminho relativo ao diretório de execução. Cada serviço terá sua própria URL e dados.
spring.datasource.url=${ESPACOS_DB_URL:jdbc:h2:file:./dados/espacos;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${ESPACOS_DB_USER:sa}
spring.datasource.password=${ESPACOS_DB_PASSWORD:}
# Conveniência de desenvolvimento: cria/atualiza o esquema sem apagar registros.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Console de estudo local; desabilitar na implantação final.
spring.h2.console.enabled=${ESPACOS_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
# Desligado por padrão na execução isolada; habilitado no teste distribuído e futuro Compose.
eureka.client.enabled=${DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.profiles.default=local
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level app=${spring.application.name} correlationId=%X{correlationId:-none} %logger{36} - %msg%n
logging.pattern.file=${logging.pattern.console}
