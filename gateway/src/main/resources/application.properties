spring.application.name=gateway
server.port=${SERVER_PORT:8082}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.cloud.gateway.server.webflux.routes[0].id=espacos
spring.cloud.gateway.server.webflux.routes[0].uri=lb://espacos
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/espacos/**
spring.cloud.gateway.server.webflux.routes[1].id=eventos
spring.cloud.gateway.server.webflux.routes[1].uri=lb://eventos
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/eventos/**
spring.profiles.default=local
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level app=${spring.application.name} correlationId=%X{correlationId:-none} %logger{36} - %msg%n
logging.pattern.file=${logging.pattern.console}
